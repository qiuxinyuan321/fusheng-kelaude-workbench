# 浮生氪劳德工作台 · Nginx 反向代理示例
#
# 工作台只监听 127.0.0.1:17880，由 Nginx 对外提供 HTTPS。使用前：
#   1. 把 workbench.example.com 换成你的域名，并为它签发证书（例如 certbot --nginx）；
#   2. 在工作台配置里设置 WORKBENCH_ORIGIN=https://workbench.example.com（与地址栏完全一致）；
#   3. sudo nginx -t && sudo systemctl reload nginx
# 详见 docs/DEPLOYMENT.md

upstream cloud_ops_workbench {
    server 127.0.0.1:17880;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name workbench.example.com;

    # 保留 ACME http-01 验证路径，证书才能自动续期
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 让对话、终端、监控等多条实时连接复用同一个 TCP 连接。
    # nginx ≥ 1.25.1 会提示这种写法已弃用，可改为 "listen 443 ssl;" 加上一行 "http2 on;"。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name workbench.example.com;

    ssl_certificate     /etc/letsencrypt/live/workbench.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workbench.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 工作台的附件上传上限为 12 MB（JSON 编码后），这里留出余量
    client_max_body_size 16m;

    # Express 的 ES Module 脚本默认返回 text/javascript，一并纳入压缩
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml font/ttf application/wasm;

    location / {
        proxy_pass http://cloud_ops_workbench;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 工作台只信任本机回环地址上的代理，并据此识别真实来源 IP（登录限流按 IP 计算）
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 对话、终端与额度都通过 SSE 实时推送：必须关闭缓冲，并放宽超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
